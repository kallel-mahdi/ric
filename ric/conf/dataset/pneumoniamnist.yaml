# PneumoniaMNIST: pediatric chest X-rays, normal versus pneumonia.
# Official MedMNIST v3 split: 4,708 train / 524 val / 624 test.
name: pneumoniamnist
num_classes: 2
image_size: 64

data_path: ${data_dir}
download: true
dataset_fraction: 1.0

normalization: medmnist
augmentation: true

supervised_epochs: 300
rl_policy_epochs: 400
walltime_min:
  rl: 240
  sl: 60
  edl: 60
  adaptive: 60
mem_gb: 32
encoder_arch: cifarresnet34
