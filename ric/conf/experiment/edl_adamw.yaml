# @package _global_
# Evidential Deep Learning baseline (Table 1 "EDL"). Identical training recipe
# to sl_adamw; only the objective and output family differ.
#   ric-train-edl -m +experiment=edl_adamw +sweep=paper dataset=cifar10,svhn,imagewoof
total_epochs: ${dataset.supervised_epochs}
# Hyperparameters that tell runs apart, so concurrent sweeps never share a checkpoint dir.
run_tag: edl_${dataset.encoder_arch}_${algorithm.optimizer}_lr${algorithm.learning_rate}_${algorithm.activation}_bs${algorithm.train_batch_size}_img${dataset.image_size}

algorithm:
  optimizer: adamw
  activation: silu
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip_norm: 0.5
  train_batch_size: 256
  eval_batch_size: 256
