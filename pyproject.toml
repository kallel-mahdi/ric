[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ric"
version = "1.0.0"
description = "Reinforced Iterative Classification: classification as reward-driven belief refinement"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# CPU JAX by default; `--extra cuda` for NVIDIA GPUs.
dependencies = [
  "jax>=0.11,<0.12",
  "flax>=0.12.10,<0.13",
  "optax>=0.2.8,<0.3",
  "orbax-checkpoint>=0.12,<0.13",
  "grain>=0.2.18",
  "numpy>=2.3",
  "torch>=2.6",          # torchvision transforms in the data workers only; JAX owns the GPU
  "torchvision>=0.21",
  "medmnist==3.0.2",
  "h5py>=3.10",
  "hydra-core>=1.3.2,<2",
  "omegaconf>=2.3,<3",
  "wandb>=0.20",
]

[project.urls]
Repository = "https://github.com/kallel-mahdi/ric"

[project.optional-dependencies]
cuda = ["jax[cuda13]>=0.11,<0.12"]
cuda12 = ["jax[cuda12]>=0.11,<0.12"]
cluster = ["hydra-submitit-launcher>=1.2"]

[dependency-groups]
dev = ["ruff>=0.6"]

# Torch is transforms-only, so pull the CPU wheels instead of multi-GB CUDA builds.
[tool.uv]
conflicts = [[{ extra = "cuda" }, { extra = "cuda12" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
ric-train = "ric.cli:main_rl"
ric-train-sl = "ric.cli:main_sl"
ric-train-edl = "ric.cli:main_edl"
ric-train-adaptive = "ric.cli:main_adaptive"
ric-eval = "ric.cli:evaluate_main"
ric-convert-galaxy10 = "ric.data.galaxy10:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ric", "ric.*"]

[tool.setuptools.package-data]
ric = ["conf/**/*.yaml"]

[tool.ruff]
cache-dir = "~/.cache/ruff"
extend-exclude = ["other"]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # prose lines and mathematical symbols
